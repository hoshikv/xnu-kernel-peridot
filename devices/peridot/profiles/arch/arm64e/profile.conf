# arm64e architecture profile for peridot (SM8635)
# Enables Pointer Authentication Codes (PAC) on ARMv8.3+

profile arm64e
	arch		arm64e
	subarch		arm64e
	# PAC support: native (architectural keys) for non-Apple ARMv8.3
	define		HAS_APPLE_PAC=1
	define		HAS_NATIVE_PAC=1
	# 4K page support
	define		ARM64_4K_PAGES=1
	# Threaded starts for arm64e kernel linking
	define		XNU_KERNEL_CHAINED_FIXUPS=1
	# Kernel cache format
	define		KERNELCACHE_ARCH=arm64e
	# Security: pointer authentication
	define		CONFIG_PAC=1
	define		CONFIG_PAC_KEYS=1
