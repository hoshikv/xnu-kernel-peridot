# iOS 27.0.1 (24A446) profile for peridot (SM8635)
# Darwin 23.6.0 / XNU 10063.x

profile ios-27-24A446
	# Base OS version
	darwin_version	23.6.0
	xnu_version	10063.141.1
	build_id	24A446
	
	# Kernel source
	kernel_source	apple-oss-distributions/xnu
	kernel_tag	xnu-10063.141.1
	
	# Required features
	require		arm64e
	require		native-pac-keys
	require		arm64e-threaded-starts
	require		native-4k-pages
	require		source-storage
	require		offline-owner
	require		mockfs
	require		unionfs
	require		trustcache-runtime
	require		public-entitlements
	require		amfi-stub
	require		sandbox-stub
	
	# Boot arguments for iOS 27
	boot_args	bootcpu=7 cpus=8 cpufreq=1 fb_hz=120 fb_threads=6 touch_poll_us=4000
	boot_args	metal=1 thermal=2
	boot_args	adsp=1 sound=4
	boot_args	battery=1
	boot_args	wifi=1
	boot_args	haptic=5
	boot_args	adreno_stream1=0
	boot_args	small_cores_after=0
	boot_args	touch_no_rpmh=1
	
	# Source storage (APFS union mount)
	boot_args	ufs=2
	boot_args	ufs_native=1
	
	# Firmware
	firmware	gpu:gen71100_gmu.bin gen71100_sqe.fw gen71100_zap.mbn
	firmware	wifi:qca6750/bd_n16t.elf qca6750/bdwlan.elf qca6750/regdb_xiaomi.bin qca6750/regdb.bin qca6750/Data.msc qca6750/wpss.mdt
	firmware	audio:adsp.mdt
	firmware	haptic:aw8697_haptic.bin
	firmware	bluetooth:bt_fw.bin
	
	# Device tree
	dt_overlay	peridot.dtb
